[defaults]
binary = "build/bin/llama-server"
host = "127.0.0.1"
port = 8080
active_model = "deepseek_v41_flash"
active_template = "coding_pinpoint"
hardware_profile = "epyc_milan_rtx4090"
threads = 56
gpu_layers = 99
flash_attn = "on"
numa = "distribute"
ctk = "q8_0"
ctv = "q8_0"
evidence_strategy = "maxsim_exact_cover"
evidence_chunk_tokens = 64
evidence_keep_ratio = "20%"
capsule_filter = "fuse8_simhash64"
zdd_sparse_kv = true
cohort_prefix_sharing = true
spec_bandit = "thompson_counterfactual"

[pto]
pto_mode = "irpgo_thinlto_split"
pto_trace_workload = "full_6stage_server_sweep"
