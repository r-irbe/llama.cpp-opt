[meta]
layer = "00-defaults"
schema_version = 2

[defaults]
active_model = "deepseek_v41_flash" # -m <model.gguf>
active_template = "coding_pinpoint" # --template
hardware_profile = "epyc_milan_rtx4090" # --hw-profile
toml_hierarchy_mode = "layered_plus_compiled" # --toml-mode
container_format = "gguf_x_npmc_v3" # --npmc-superblock
active_instance = "llama-primary-8080" # --instance-id
engine_flavor = "ik_llama_rust_ffi" # --engine-flavor
inplace_handover_mode = "atomic_port_rebind" # --handover-mode
slab_arbitration_policy = "cooperative_lru_yield" # --slab-policy
instance_port = "8080" # --port
evidence_strategy = "maxsim_exact_cover" # --evidence-strategy
evidence_chunk_tokens = "64" # --evidence-chunk-tokens
evidence_keep_ratio = "20%" # --evidence-keep-ratio
capsule_filter = "fuse8_simhash64" # --capsule-filter
wake_min_hamming_sim = "0.60" # --capsule-wake-sim
global_summary_header = "on" # --global-summary-header
ctx_size = "262144" # -c
kv_type_k = "q8_0" # -ctk
kv_type_v = "q8_0" # -ctv
indexer_cache_type_k = "q8_0" # -ictk
swa_compress = "on" # --swa-compress
fused_indexer = "on" # -fidx
dsa_attention = "on" # -dsa
zdd_sparse_kv = "on" # --zdd-sparse-kv
cohort_sharing = "on" # --cohort-prefix-sharing
tiered_kv_dma = "auto_hot_window" # --tiered-kv
spec_bandit = "thompson_counterfactual" # --spec-autotune
treegraft_fusion = "on" # --treegraft
draft_max = "8" # --draft-max
concurrency_knee_guard = "on" # --spec-knee-guard
threads = "56" # -t
numa_strategy = "distribute" # --numa
defer_ple = "on" # --defer-ple
thp_hugepages = "on" # --transparent-huge-pages
io_uring_direct = "on" # --io-uring
rust_mmap_ffi = "on" # -DGGML_RUST_MMAP_ENGINE=ON
pto_mode = "irpgo_thinlto_split" # --pto
pto_trace_workload = "full_6stage_server_sweep" # --pto-workload
pto_toolchain = "clang21_lld_znver3" # --compiler
pto_target_linkage = "static_plus_shared_libs" # --shared-libs
thinking_effort = "max_deep_think" # --reasoning-budget
temp = "0.1" # --temp
telemetry_mode = "pi_telemetry_plus_jsonl" # --telemetry
sdk_sync_targets = "all_7_harnesses" # --sync-sdks

[pto]
pto_mode = "irpgo_thinlto_split"
pto_trace_workload = "full_6stage_server_sweep"
pto_toolchain = "clang21_lld_znver3"
pto_target_linkage = "static_plus_shared_libs"
profile_dir = ".pi/pto-profiles"
merged_profdata = ".pi/pto-profiles/merged.profdata"
optimized_binary = "build-pto/bin/llama-server"
