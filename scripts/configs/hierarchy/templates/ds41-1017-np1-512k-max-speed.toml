[templates.ds41-1017-np1-512k-max-speed]
display_name = "DS4.1-1017 NP1 512K Max-Speed (Q8_0 KV + SWA Compress + DSpark + Pinpoint)"
description = "Single-slot 512K max-speed & deep-reasoning preset: -np 1 -c 524288 --swa-compress -ctk q8_0 -ctv q8_0 -ictk q8_0 -fidx -dsa -dsatk 1024 -mla 2 --defer-ple + DSpark + ngram-mod."
target_use_case = "Primary single-agent interactive coding & deep mathematical reasoning at 512K context"
built_in = true

[templates.ds41-1017-np1-512k-max-speed.overrides]
parallel_slots = "1"
ctx_size = "524288"
swa_compress = "on"
kv_type_k = "q8_0"
kv_type_v = "q8_0"
indexer_cache_type_k = "q8_0"
fused_indexer = "on"
dsa_attention = "on"
mla_mode = "2"
defer_ple = "on"
defer_experts = "off"
zdd_sparse_kv = "on"
thp_hugepages = "on"
threads = "56"
numa_strategy = "distribute"
spec_type = "dspark_plus_ngram_mod"
spec_ckpt_mode = "per-step"
spec_bandit = "thompson_counterfactual"
evidence_strategy = "code_pinpoint"
evidence_chunk_tokens = "140"
evidence_keep_ratio = "20%"
capsule_filter = "fuse8_simhash64"
thinking_effort = "max_deep_think"
