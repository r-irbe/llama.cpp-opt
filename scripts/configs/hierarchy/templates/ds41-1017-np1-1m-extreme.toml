[templates.ds41-1017-np1-1m-extreme]
display_name = "DS4.1-1017 NP1 1M Extreme Context (Q4_0 KV + Q8_0 Indexer + SWA Compress)"
description = "Single-slot 1M token extreme context preset: -np 1 -c 1048576 --swa-compress -ctk q4_0 -ctv q4_0 -ictk q8_0 -fidx -dsa -dsatk 1024 -mla 2 --defer-ple + Fuse16 capsules."
target_use_case = "1M-token full-repository synthesis, trace forensics, and multi-paper citation walks"
built_in = true

[templates.ds41-1017-np1-1m-extreme.overrides]
parallel_slots = "1"
ctx_size = "1048576"
swa_compress = "on"
kv_type_k = "q4_0"
kv_type_v = "q4_0"
indexer_cache_type_k = "q8_0"
fused_indexer = "on"
dsa_attention = "on"
mla_mode = "2"
defer_ple = "on"
defer_experts = "off"
zdd_sparse_kv = "on"
thp_hugepages = "on"
threads = "56"
numa_strategy = "distribute"
spec_type = "dspark_plus_ngram_mod"
spec_ckpt_mode = "per-step"
spec_bandit = "thompson_counterfactual"
evidence_strategy = "code_pinpoint"
evidence_chunk_tokens = "140"
evidence_keep_ratio = "15%"
capsule_filter = "fuse16_simhash64"
thinking_effort = "max_deep_think"
