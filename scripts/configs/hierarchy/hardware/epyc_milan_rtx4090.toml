# =============================================================================
# Layer 1: hardware/epyc_milan_rtx4090.toml -- Hardware Topology Profile
# =============================================================================

[hardware]
id = "epyc_milan_rtx4090"
display_name = "Dual AMD EPYC 7453 (56C Zen 3 NPS4) + NVIDIA RTX 4090 (24 GiB sm_89)"
cpu_topology = "2x EPYC 7453 (56C/112T, 8 NUMA nodes NPS4, 16-ch DDR4-3200, 503 GiB RAM)"
gpu_topology = "1x NVIDIA GeForce RTX 4090 (24 GiB GDDR6X, 72 MiB L2 Cache, sm_89)"
storage_topology = "NVMe Gen4 Direct I/O + OpenZFS lavapool + 2 MiB HugeTLB"

[hardware.defaults]
threads = "56"
numa_strategy = "distribute"
gpu_layers = "99"
flash_attn = "on"
fused_moe = "on"
thp_hugepages = "on"
io_uring_direct = "on"
l2_persisting_mb = "48"

[pto]
pto_mode = "irpgo_thinlto_split"
pto_toolchain = "clang21_lld_znver3"
pto_target_linkage = "static_plus_shared_libs"
cflags = "-O3 -march=znver3 -mtune=znver3 -fsplit-machine-functions -flto=thin"
ldflags = "-fuse-ld=lld -Wl,--icf=safe -Wl,--thinlto-cache-dir=.pi/thinlto-cache"
