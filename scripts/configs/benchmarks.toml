[defaults]
output_db = "results/benchmarks.sqlite"
summary_md = "results/benchmark_summary.md"
numa_mode = "distribute"
repetitions = 3
warmup_rounds = 1

[matrix.iso_parameter]
description = "Identical standardized parameters across all benchmarked engines"
context_lengths = [4096, 16384, 65536, 262144]
threads = 56
batch_sizes = [512, 2048]
cache_types_k = ["q8_0", "q4_0"]
cache_types_v = ["q8_0", "q4_0"]

[matrix.pareto_optimized]
description = "Autotuned peak performance profile for feat/numa-split"
transparent_huge_pages = true
zdd_sparse_kv = true
cohort_prefix_sharing = true
defer_ple = true
io_uring_prefetch = true

[targets.deepseek_v41_flash]
name = "DeepSeek-V4.1-Flash"
# models/DeepSeek-V4.1-Flash-1017/UD-Q4_K_XL is a completed 9-shard HF download
# and is now LOADABLE: mainline type 43 (MXFP8) was ported; first serving smoke
# test 2026-10-29, binary 125fdd9b (see scratch/2026-10-28-mxfp8-engram-port-
# and-removals-audit.md, "UD-Q4_K_XL mainline packaging" section). Cold-cache
# datapoint (1 stream, c=16384, experts CPU): PP 43-50 tok/s, TG ~17.5 tok/s.
# EngramQ8 rows remain the primary measured baseline until a ranked re-run.
model_path = "${LLAMA_MODEL_ROOT}/DeepSeek-V4.1-Flash-1017/UD-Q4_K_XL/DeepSeek-V4.1-Flash-1017-UD-Q4_K_XL-00001-of-00009.gguf"
ngl = 99
offload_tensors = "exps=CPU,engram_embd=CPU,nextn=CPU"
mla = 2
defer_ple = true
context_lengths = [65536, 262144, 524288, 1048576]

[targets.glm_53]
name = "GLM-5.3-Flash-UD-IQ4_XS"
model_path = "models/GLM-5.3-Flash-GGUF/UD-IQ4_XS/GLM-5.3-Flash-UD-IQ4_XS-00001-of-00005.gguf"
ngl = 99
offload_tensors = "exps=CPU"
context_lengths = [4096, 16384, 65536, 262144]

[targets.qwen38_27b]
name = "Qwen3.8-27B-UD-Q4_K_XL"
model_path = "models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf"
ngl = 99
context_lengths = [4096, 16384, 65536, 262144, 1048576]
